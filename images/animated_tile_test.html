<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Artist Tile — R&D</title>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    font-family: monospace;
    color: #666;
    min-height: 100vh;
  }

  /* ── LAYOUT ── */
  /* Mobile: stacked */
  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px 16px 48px;
  }

  /* Desktop: sidebar left, canvas right */
  @media (min-width: 1100px) {
    .app {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 32px;
      padding: 32px;
    }
    .sidebar {
      order: 1;
      width: 320px;
      flex-shrink: 0;
      position: sticky;
      top: 32px;
      max-height: calc(100vh - 64px);
      overflow-y: auto;
    }
    .canvas-col {
      order: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
  }

  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 338px;
  }

  .canvas-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #333;
    text-align: center;
  }

  /* ── CANVAS ── */
  canvas#preview {
    display: block;
    width: 100%;
    max-width: 500px;
    aspect-ratio: 1080 / 1920;
    background: #000;
    flex-shrink: 0;
  }

  @media (min-width: 1100px) {
    canvas#preview {
      /* Im Desktop: verfügbare Höhe nutzen */
      width: auto;
      height: calc(100vh - 80px);
      max-width: none;
    }
  }

  /* ── UPLOAD ZONE ── */
  .upload-zone {
    width: 100%;
    height: 52px;
    border: 1px dashed #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #444;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    user-select: none;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: #f35a2a; color: #f35a2a; }
  .upload-zone input { display: none; }

  /* ── CONTROLS ── */
  .section {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .section-title {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #333;
    border-bottom: 1px solid #1a1a1a;
    padding-bottom: 4px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #555;
  }

  .row label { min-width: 90px; flex-shrink: 0; }

  .val { min-width: 36px; text-align: right; color: #444; font-size: 10px; flex-shrink: 0; }

  input[type=range] { flex: 1; accent-color: #f35a2a; min-width: 0; }

  input[type=text] {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #aaa;
    font-family: monospace;
    font-size: 11px;
    padding: 3px 6px;
    min-width: 0;
  }

  select {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #666;
    font-size: 10px;
    font-family: monospace;
    padding: 3px 6px;
  }

  .stage-btns { display: flex; gap: 8px; }

  .stage-btn {
    flex: 1;
    padding: 6px 0;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #555;
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .stage-btn:hover { border-color: #444; color: #888; }
  .stage-btn.active-sun  { background: #feb50022; border-color: #feb500; color: #feb500; }
  .stage-btn.active-sky  { background: #f35a2a22; border-color: #f35a2a; color: #f35a2a; }
  .stage-btn.active-moon { background: #00d3c722; border-color: #00d3c7; color: #00d3c7; }

  .export-row { display: flex; gap: 8px; }

  .btn {
    flex: 1;
    padding: 9px 0;
    border: 1px solid #2a2a2a;
    background: #1a1a1a;
    color: #555;
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: #444; color: #888; }
  .btn.primary { border-color: #f35a2a88; color: #f35a2a; }
  .btn.primary:hover { background: #f35a2a22; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .status {
    font-size: 10px;
    color: #333;
    min-height: 14px;
    text-align: center;
    width: 338px;
  }
  .status.ok  { color: #00d3c7; }
  .status.err { color: #f35a2a; }

  /* Scrollbar für sidebar */
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-track { background: #111; }
  .sidebar::-webkit-scrollbar-thumb { background: #2a2a2a; }
</style>
</head>
<body>

<div class="app">

  <!-- ═══ SIDEBAR (Controls) ═══════════════════════════════ -->
  <div class="sidebar">

    <div class="label">Iberia Eclipse — Artist Tile R&D</div>

    <!-- Upload -->
    <div class="section">
      <div class="section-title">Artist Foto</div>
      <div class="upload-zone" id="uploadZone"
        onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])">
        <span id="uploadLabel">⬆ Drag & Drop oder Klick</span>
      </div>
    </div>

    <!-- Stage -->
    <div class="section">
      <div class="section-title">Stage</div>
      <div class="stage-btns">
        <button class="stage-btn" id="btn-sun" onclick="setStage('sun')">☀ Sun</button>
        <button class="stage-btn" id="btn-sky" onclick="setStage('sky')">◑ Sky</button>
        <button class="stage-btn active-moon" id="btn-moon" onclick="setStage('moon')">● Moon</button>
      </div>
    </div>


    <!-- Video -->
    <div class="section">
      <div class="section-title">Video</div>
      <div class="row">
        <label>größe</label>
        <input type="range" min="20" max="300" value="180" oninput="vidSize=+this.value;document.getElementById('vVidS').textContent=this.value+'%'">
        <span class="val" id="vVidS">180%</span>
      </div>
      <div class="row">
        <label>Y</label>
        <input type="range" min="0" max="3" step="0.1" value="1" oninput="vidY=this.value/100;document.getElementById('vVidY').textContent=this.value+'%'">
        <span class="val" id="vVidY">1%</span>
      </div>
      <div class="row">
        <label>opacity</label>
        <input type="range" min="0" max="100" value="100" oninput="vidOpacity=this.value/100;document.getElementById('vVidO').textContent=this.value+'%'">
        <span class="val" id="vVidO">100%</span>
      </div>
    </div>

    <!-- Face -->
    <div class="section">
      <div class="section-title">Face</div>
      <div class="row">
        <label>maske größe</label>
        <input type="range" min="10" max="100" value="75" oninput="faceSize=+this.value;document.getElementById('vFace').textContent=this.value+'%'">
        <span class="val" id="vFace">75%</span>
      </div>
      <div class="row">
        <label>X</label>
        <input type="range" min="-50" max="50" value="0" oninput="faceX=this.value/100;document.getElementById('vFaceX').textContent=this.value+'%'">
        <span class="val" id="vFaceX">0%</span>
      </div>
      <div class="row">
        <label>Y</label>
        <input type="range" min="-50" max="50" value="0" oninput="faceY=this.value/100;document.getElementById('vFaceY').textContent=this.value+'%'">
        <span class="val" id="vFaceY">0%</span>
      </div>
      <div class="row">
        <label>foto zoom</label>
        <input type="range" min="50" max="200" value="147" oninput="faceZoom=this.value/100;document.getElementById('vFaceZ').textContent=this.value+'%'">
        <span class="val" id="vFaceZ">147%</span>
      </div>
      <div class="row">
        <label>foto X</label>
        <input type="range" min="-50" max="50" value="0" oninput="facePanX=this.value/100;document.getElementById('vFacePX').textContent=this.value+'%'">
        <span class="val" id="vFacePX">0%</span>
      </div>
      <div class="row">
        <label>foto Y</label>
        <input type="range" min="-50" max="50" value="21" oninput="facePanY=this.value/100;document.getElementById('vFacePY').textContent=this.value+'%'">
        <span class="val" id="vFacePY">21%</span>
      </div>
      <div class="row">
        <label>blend</label>
        <select onchange="faceBlend=this.value">
          <option value="luminosity" selected>luminosity</option>
          <option value="source-over">normal</option>
          <option value="soft-light">soft-light</option>
          <option value="overlay">overlay</option>
          <option value="multiply">multiply</option>
        </select>
      </div>
    </div>

    <!-- Grain -->
    <div class="section">
      <div class="section-title">Grain</div>
      <div class="row">
        <label>opacity</label>
        <input type="range" min="0" max="100" value="60" oninput="grainOpacity=this.value/100;document.getElementById('vGrO').textContent=this.value+'%'">
        <span class="val" id="vGrO">60%</span>
      </div>
      <div class="row">
        <label>blend</label>
        <select onchange="grainBlend=this.value">
          <option value="soft-light" selected>soft-light</option>
          <option value="overlay">overlay</option>
          <option value="luminosity">luminosity</option>
          <option value="screen">screen</option>
          <option value="source-over">normal</option>
        </select>
      </div>
      <div class="row">
        <label>fps</label>
        <input type="range" min="1" max="30" value="15" oninput="grainFps=+this.value;document.getElementById('vGrF').textContent=this.value+'fps'">
        <span class="val" id="vGrF">15fps</span>
      </div>
    </div>

    <!-- Stage Title -->
    <div class="section">
      <div class="section-title">Stage Title</div>
      <div class="row">
        <label>Y</label>
        <input type="range" min="2" max="50" value="21" oninput="titleY=this.value/100;document.getElementById('vTY').textContent=this.value+'%'">
        <span class="val" id="vTY">21%</span>
      </div>
    </div>

    <!-- Text -->
    <div class="section">
      <div class="section-title">Text</div>
      <div class="row">
        <label>name Y</label>
        <input type="range" min="30" max="95" value="77" oninput="nameY=this.value/100;document.getElementById('vNY').textContent=this.value+'%'">
        <span class="val" id="vNY">77%</span>
      </div>
      <div class="row">
        <label>artist name</label>
        <input type="text" value="ARTIST NAME" oninput="artistName=this.value">
      </div>
      <div class="row">
        <label>name größe</label>
        <input type="range" min="20" max="150" value="80" oninput="artistSize=+this.value;document.getElementById('vAS').textContent=this.value+'px'">
        <span class="val" id="vAS">80px</span>
      </div>
      <div class="row">
        <label>crew</label>
        <input type="text" value="ARTIST CREW" oninput="subtitleText=this.value">
      </div>
    </div>

    <!-- Export -->
    <div class="section">
      <div class="section-title">Export</div>
      <div class="row">
        <label>dauer</label>
        <input type="range" min="2" max="15" value="5" step="1" oninput="recordDuration=+this.value;document.getElementById('vDur').textContent=this.value+'s'">
        <span class="val" id="vDur">5s</span>
      </div>
      <div class="export-row">
        <button class="btn primary" id="btnMp4" onclick="startExport('mp4')">⬇ MP4</button>
        <button class="btn" id="btnWebm" onclick="startExport('webm')">⬇ WebM</button>
      </div>
      <button class="btn" style="width:100%;margin-top:4px;" onclick="copyValues()">⎘ Werte kopieren</button>
    </div>

  </div><!-- /sidebar -->

  <!-- ═══ CANVAS COL ══════════════════════════════════════ -->
  <div class="canvas-col">

    <canvas id="preview" width="1080" height="1920"></canvas>

    <div class="status" id="status">loading…</div>

  </div><!-- /canvas-col -->

</div><!-- /app -->

<video id="vidEl" src="videos/solar-eclipse.mp4" autoplay loop muted playsinline
  style="position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;top:0;left:0;"></video>

<script>
const W = 1080, H = 1920;

const stageData = {
  sun:  { bg: 'images/sun-bg.webp',  svg: 'images/sun.svg',  title: 'images/sun-stage-title.svg',  color: '#feb500', svgSize: 119, titleScale: 75 },
  sky:  { bg: 'images/sky-bg.webp',  svg: 'images/sky.svg',  title: 'images/sky-stage-title.svg',  color: '#f35a2a', svgSize: 119, titleScale: 75 },
  moon: { bg: 'images/moon-bg.webp', svg: 'images/moon.svg', title: 'images/moon-stage-title.svg', color: '#00d3c7', svgSize: 132, titleScale: 75 },
};

let currentStage  = 'moon';
const svgOpacity  = 0.35;  // fest
let vidSize       = 180;
let vidY          = 0.01;
let vidOpacity    = 1;
let faceSize      = 75;
let faceX         = 0;
let faceY         = 0;
let faceZoom      = 1.47;
let facePanX      = -0.03;
let facePanY      = 0.21;
let faceBlend     = 'luminosity';
let titleY        = 0.21;
let titleScale    = 60;
let nameY         = 0.77;
let artistName    = 'ARTIST NAME';
let artistSize    = 80;
let subtitleText  = 'ARTIST CREW';
let grainOpacity  = 0.6;
let grainBlend    = 'soft-light';
let grainFps      = 15;
let recordDuration = 5;
let svgAngle      = 0;
let lastGrainTs   = 0;
let grainCanvas   = null;
let ffmpegLoaded  = false;
let ffmpegInstance = null;
let uploadedFace  = null;  // User-uploaded face image

// Montserrat
const fl = document.createElement('link');
fl.rel = 'stylesheet';
fl.href = 'https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap';
document.head.appendChild(fl);

// ── ASSETS ───────────────────────────────────────────────────────────
const assets = {};

function loadImg(src) {
  if (assets[src]) return Promise.resolve(assets[src]);
  return new Promise(res => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => { assets[src] = img; res(img); };
    img.onerror = () => { console.warn('Could not load:', src); res(null); };
    img.src = src;
  });
}

async function preload() {
  const srcs = [
    'images/sun-bg.webp','images/sky-bg.webp','images/moon-bg.webp',
    'images/sun.svg','images/sky.svg','images/moon.svg',
    'images/sun-stage-title.svg','images/sky-stage-title.svg','images/moon-stage-title.svg',
    'images/info-layer.webp',
  ];
  await Promise.all(srcs.map(loadImg));
  // face.png als Fallback
  await loadImg('images/face.png');
  setStatus('✓ bereit', 'ok');
}

// ── UPLOAD ───────────────────────────────────────────────────────────
function handleDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('uploadZone').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleFile(file);
}

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      uploadedFace = img;
      document.getElementById('uploadLabel').textContent = '✓ ' + file.name;
      const z = document.getElementById('uploadZone');
      z.style.color = '#00d3c7';
      z.style.borderColor = '#00d3c7';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// Drag events müssen auf document-Ebene abgefangen werden
document.addEventListener('DOMContentLoaded', () => {
  const zone = document.getElementById('uploadZone');
  zone.addEventListener('dragover',  e => { e.preventDefault(); e.stopPropagation(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', e => { e.stopPropagation(); zone.classList.remove('drag'); });
  zone.addEventListener('drop',      e => handleDrop(e));
});

// ── STAGE ────────────────────────────────────────────────────────────
const vid = document.getElementById('vidEl');
vid.addEventListener('error', () => setStatus('✗ video error', 'err'));

function setStage(s) {
  currentStage = s;
  ['sun','sky','moon'].forEach(x =>
    document.getElementById('btn-'+x).className = 'stage-btn' + (x===s ? ' active-'+x : ''));
}

// ── DRAW ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('preview');
const ctx    = canvas.getContext('2d');
let prevTs   = 0;

function drawScene(ctx, w, h, ts, angle) {
  const stage = stageData[currentStage];
  ctx.clearRect(0, 0, w, h);

  // Layer 1: BG
  const bg = assets[stage.bg];
  if (bg) { ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; fitCover(ctx,bg,w,h); }

  // Layer 2: SVG rotierend + eingefärbt
  const svgImg = assets[stage.svg];
  if (svgImg) {
    const sz = w * (stage.svgSize / 100);
    const oc = new OffscreenCanvas(sz, sz);
    const octx = oc.getContext('2d');
    octx.drawImage(svgImg, 0, 0, sz, sz);
    octx.globalCompositeOperation = 'source-in';
    octx.fillStyle = stage.color;
    octx.fillRect(0, 0, sz, sz);
    ctx.save();
    ctx.globalAlpha = svgOpacity;
    ctx.globalCompositeOperation = 'source-over';
    ctx.translate(w/2, h/2);
    ctx.rotate(angle * Math.PI / 180);
    ctx.drawImage(oc, -sz/2, -sz/2);
    ctx.restore();
  }

  // Layer 3: Face kreisförmig maskiert mit Positions- und Zoom-Kontrolle
  const face = uploadedFace || assets['images/face.png'];
  if (face) {
    const r = (w * faceSize / 100) / 2;
    // Masken-Mittelpunkt (verschiebbar)
    const cx = w/2 + faceX * w;
    const cy = h/2 + faceY * h;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = faceBlend;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.clip();
    // Foto innerhalb der Maske: zoom + pan
    const fw = face.naturalWidth || face.width;
    const fh = face.naturalHeight || face.height;
    const baseScale = Math.max((r*2)/fw, (r*2)/fh);
    const fs = baseScale * faceZoom;
    const imgW = fw * fs, imgH = fh * fs;
    const imgX = cx - imgW/2 + facePanX * r * 2;
    const imgY = cy - imgH/2 + facePanY * r * 2;
    ctx.drawImage(face, imgX, imgY, imgW, imgH);
    ctx.restore();
  }

  // Layer 4: Eclipse Video (screen) — 1:1, Y-verschiebbar
  if (vid.readyState >= 2 && vid.videoWidth > 0) {
    const vw = vid.videoWidth, vh = vid.videoHeight;
    const targetSize = Math.min(w, h) * (vidSize / 100);
    const s = Math.max(targetSize/vw, targetSize/vh);
    const dw = vw*s, dh = vh*s;
    const centerY = h/2 + vidY * h;
    ctx.globalAlpha = vidOpacity;
    ctx.globalCompositeOperation = 'screen';
    ctx.drawImage(vid, (w-dw)/2, centerY-dh/2, dw, dh);
  }

  // Layer 5: Grain
  if (!grainCanvas || ts - lastGrainTs >= 1000/grainFps) {
    grainCanvas = new OffscreenCanvas(w, h);
    const gctx = grainCanvas.getContext('2d');
    const id = gctx.createImageData(w, h);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = (Math.random()*160)|0;
      d[i]=d[i+1]=d[i+2]=v; d[i+3]=Math.round(grainOpacity*255);
    }
    gctx.putImageData(id, 0, 0);
    lastGrainTs = ts;
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = grainBlend;
  ctx.drawImage(grainCanvas, 0, 0);
  // Reset nach Grain — wichtig!
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // Layer 6: Stage Title SVG — Tight-Bbox auf exakt 63px Höhe skaliert
  const titleImg = assets[stage.title];
  if (titleImg && titleImg.naturalWidth) {
    // Erst groß rendern für Bbox-Analyse
    const tmpW = titleImg.naturalWidth;
    const tmpH = titleImg.naturalHeight;
    const tmp = new OffscreenCanvas(tmpW, tmpH);
    const tmpCtx = tmp.getContext('2d');
    tmpCtx.drawImage(titleImg, 0, 0, tmpW, tmpH);

    // Tight Bbox finden
    const px = tmpCtx.getImageData(0, 0, tmpW, tmpH).data;
    let minY = tmpH, maxY = 0, minX = tmpW, maxX = 0;
    for (let y = 0; y < tmpH; y++) {
      for (let x = 0; x < tmpW; x++) {
        if (px[(y * tmpW + x) * 4 + 3] > 10) {
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
        }
      }
    }
    const bboxW = maxX - minX + 1;
    const bboxH = maxY - minY + 1;

    // Skalieren so dass sichtbare Höhe = 63px
    const scale = 63 / bboxH;
    const drawW = bboxW * scale;
    const drawH = 63;

    // Nur den sichtbaren Bereich ausschneiden und einfärben
    const oc2 = new OffscreenCanvas(Math.ceil(drawW), Math.ceil(drawH));
    const oc2ctx = oc2.getContext('2d');
    oc2ctx.drawImage(titleImg,
      minX, minY, bboxW, bboxH,
      0, 0, drawW, drawH);
    oc2ctx.globalCompositeOperation = 'source-in';
    oc2ctx.fillStyle = stage.color;
    oc2ctx.fillRect(0, 0, drawW, drawH);

    ctx.drawImage(oc2, (w - drawW) / 2, titleY * h - drawH / 2, drawW, drawH);
  }

  // Layer 7: Artist Name — ALLCAPS, Montserrat Bold, letterSpacing 100
  ctx.font = `bold ${artistSize}px 'Montserrat', sans-serif`;
  ctx.fillStyle = stage.color;
  ctx.textBaseline = 'alphabetic';
  const nameDrawY = nameY * h;
  drawSpacedText(ctx, artistName.toUpperCase(), w/2, nameDrawY, 100);

  // Layer 8: Crew — ALLCAPS, Montserrat, letterSpacing 255, weiß, baseline 53px unter Name
  const subSize = Math.round(artistSize * 0.45);
  ctx.font = `${subSize}px 'Montserrat', sans-serif`;
  ctx.fillStyle = '#ffffff';
  drawSpacedText(ctx, subtitleText.toUpperCase(), w/2, nameDrawY + 53, 255);

  // Layer 9: Info-layer
  const info = assets['images/info-layer.webp'];
  if (info) { ctx.drawImage(info,0,0,w,h); }
}

function drawSpacedText(ctx, text, cx, y, spacing) {
  // parseFloat("bold 80px ...") gibt NaN — daher manuell extrahieren
  const fontSizeMatch = ctx.font.match(/(\d+(?:\.\d+)?)px/);
  const fontSize = fontSizeMatch ? parseFloat(fontSizeMatch[1]) : 40;
  const spacePx = spacing * fontSize / 1000;
  let totalW = 0;
  for (let i = 0; i < text.length; i++) {
    totalW += ctx.measureText(text[i]).width;
    if (i < text.length-1) totalW += spacePx;
  }
  let x = cx - totalW/2;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  for (let i = 0; i < text.length; i++) {
    ctx.fillText(text[i], x, y);
    x += ctx.measureText(text[i]).width + (i < text.length-1 ? spacePx : 0);
  }
  ctx.textAlign = prevAlign;
}

function fitCover(ctx, img, w, h) {
  const sw = img.naturalWidth||img.videoWidth, sh = img.naturalHeight||img.videoHeight;
  if (!sw||!sh) return;
  const s = Math.max(w/sw, h/sh);
  ctx.drawImage(img, (w-sw*s)/2, (h-sh*s)/2, sw*s, sh*s);
}

function loop(ts) {
  const dt = Math.min((ts-prevTs)/1000, 0.1);
  prevTs = ts;
  svgAngle = (svgAngle + 9*dt) % 360;
  drawScene(ctx, W, H, ts, svgAngle);
  requestAnimationFrame(loop);
}

// ── RECORD ───────────────────────────────────────────────────────────
async function recordCanvas() {
  const rc = document.createElement('canvas');
  rc.width = W; rc.height = H;
  const rctx = rc.getContext('2d');

  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9' : 'video/webm';
  const stream   = rc.captureStream(30);
  const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 25_000_000 });
  const chunks   = [];
  recorder.ondataavailable = e => { if (e.data.size>0) chunks.push(e.data); };

  vid.currentTime = 0;
  await vid.play();
  recorder.start();

  let recAngle = svgAngle;
  let recLastGrain = 0, recGrainCanvas = null;

  await new Promise(resolve => {
    const t0 = performance.now();
    function frame(ts) {
      const elapsed = (ts-t0)/1000;
      recAngle = (recAngle + 9/30) % 360;
      if (ts-recLastGrain >= 1000/grainFps || !recGrainCanvas) {
        recGrainCanvas = new OffscreenCanvas(W, H);
        const rgctx = recGrainCanvas.getContext('2d');
        const id = rgctx.createImageData(W, H);
        const d = id.data;
        for (let i=0;i<d.length;i+=4){const v=(Math.random()*160)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=Math.round(grainOpacity*255);}
        rgctx.putImageData(id,0,0);
        recLastGrain = ts;
      }
      const saved = grainCanvas;
      grainCanvas = recGrainCanvas;
      drawScene(rctx, W, H, ts, recAngle);
      grainCanvas = saved;
      setStatus('⏺ '+Math.max(0,recordDuration-elapsed).toFixed(1)+'s…');
      if (elapsed < recordDuration) requestAnimationFrame(frame);
      else { recorder.stop(); vid.pause(); resolve(); }
    }
    requestAnimationFrame(frame);
  });
  await new Promise(r => { recorder.onstop = r; });
  return new Blob(chunks, { type: mimeType });
}

// ── EXPORT ───────────────────────────────────────────────────────────
async function startExport(format) {
  const b1=document.getElementById('btnMp4'), b2=document.getElementById('btnWebm');
  b1.disabled = b2.disabled = true;
  try {
    setStatus('⏳ Recording…');
    const webmBlob = await recordCanvas();
    if (format==='webm') { dl(webmBlob,'artist_tile.webm'); setStatus('✓ WebM fertig','ok'); return; }
    setStatus('⏳ Konvertiere zu MP4…');
    const ff = await getFFmpeg();
    ff.FS('writeFile','input.webm', await window._fetchFile(webmBlob));
    await ff.run(
      '-r', '30',
      '-i', 'input.webm',
      '-c:v', 'libx264', '-preset', 'fast',
      '-crf', '14', '-pix_fmt', 'yuv420p',
      '-r', '30',
      '-movflags', '+faststart',
      'output.mp4'
    );
    const mp4Data = ff.FS('readFile','output.mp4');
    const mp4Blob = new Blob([mp4Data.buffer],{type:'video/mp4'});
    ff.FS('unlink','input.webm'); ff.FS('unlink','output.mp4');
    dl(mp4Blob,'artist_tile_insta.mp4');
    setStatus('✓ MP4 '+(mp4Blob.size/1024/1024).toFixed(1)+'MB — Instagram ready','ok');
  } catch(e) {
    setStatus('✗ '+(e?.message||e?.toString()||'Fehler'),'err');
    console.error(e);
  } finally { b1.disabled=b2.disabled=false; }
}

async function getFFmpeg() {
  if (ffmpegLoaded) return ffmpegInstance;
  setStatus('⏳ Lade FFmpeg (~30MB)…');
  const { createFFmpeg, fetchFile } = FFmpeg;
  const port = window.location.port || '80';
  ffmpegInstance = createFFmpeg({ log: true, corePath: `http://localhost:${port}/ffmpeg/ffmpeg-core.js` });
  await ffmpegInstance.load();
  ffmpegLoaded = true;
  window._fetchFile = fetchFile;
  return ffmpegInstance;
}

function dl(blob, name) {
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),3000);
}

function copyValues() {
  const vals = {
    stage:       currentStage,
    svgSize,     svgOpacity,
    vidSize,     vidY,        vidOpacity,
    faceSize,    faceX,       faceY,
    faceZoom,    facePanX,    facePanY,   faceBlend,
    titleY,      titleScale,
    nameY,       artistName,  artistSize, subtitleText,
    grainOpacity,grainBlend,  grainFps,
  };
  const text = JSON.stringify(vals, null, 2);
  navigator.clipboard.writeText(text).then(() => {
    setStatus('✓ Werte in Zwischenablage kopiert', 'ok');
  }).catch(() => {
    // Fallback: in neuem Fenster anzeigen
    const w = window.open('','_blank','width=500,height=600');
    w.document.write('<pre style="background:#111;color:#0f0;padding:20px;font-size:12px;">' + text + '</pre>');
    setStatus('✓ Werte in neuem Fenster', 'ok');
  });
}

function setStatus(msg, type='') {
  const el=document.getElementById('status');
  el.textContent=msg; el.className='status '+type;
}

// ── INIT ─────────────────────────────────────────────────────────────
preload().then(() => {
  requestAnimationFrame(ts => { prevTs=ts; loop(ts); });
});
</script>
